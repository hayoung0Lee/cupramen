[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioros"
version = "0.1.0" # Early development version
description = "Behavior Tree OS that integrates LLM, generates JSON responses, and runs in user-defined environments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hayoung Lee", email = "hayoung0.lee@gmail.com" }]
keywords = ["behavior-trees", "robotics", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",        # Early development stage
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<3.15"

dependencies = [
    "py-trees>=2.2.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0", "anthropic>=0.18.0"]
viz = ["pydot>=1.4.2", "graphviz>=0.20.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
# Homepage = "https://github.com/hayoung0Lee/BehaviorOS"
Repository = "https://github.com/hayoung0Lee/BehaviorOS"
Issues = "https://github.com/hayoung0Lee/BehaviorOS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["behavioros*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=behavioros",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
